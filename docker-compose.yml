services:
  frontend:
    build: ./frontend/ironforge
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/ironforge:/src
      - /src/node_modules
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ironforge
      POSTGRES_USER: ironforge
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
